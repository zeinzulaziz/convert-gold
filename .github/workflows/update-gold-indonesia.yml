name: Update Gold Indonesia (Antam/UBS/Pegadaian)

on:
  schedule:
    # Heartbeat 4x sehari (UTC). Kalau satu run skip/gagal, run berikutnya menutup.
    - cron: '*/5 * * * *' # TEMP TEST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-gold-indonesia
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Fetch & parse hargaemas.com
        run: node scripts/fetch-gold-indonesia.js

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/gold-indonesia.json
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data."
          else
            git commit -m "chore: update gold indonesia prices"
            git push
          fi
